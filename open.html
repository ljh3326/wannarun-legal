<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>앱으로 돌아가기 · 뛸래</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!--
  가입 확인·비밀번호 재설정 메일 링크의 중간 다리 (2026-10-31).
  Supabase가 확인한 뒤 이 페이지로 토큰을 붙여 보낸다 → 같은 토큰을 붙여 wannarun://auth/confirm 으로 앱을 연다.
  iOS 브라우저는 서버 리다이렉트로 앱 주소(wannarun://)를 여는 걸 막을 때가 있어 빈 화면이 됐다. 버튼을 누르는 건 막지 않는다.
  토큰은 주소의 #(해시) 뒤에 있어 서버로 가지 않고, 이 페이지는 어디에도 저장·전송하지 않는다.
-->
<main>
  <h1>뛸래 앱으로 돌아가기</h1>
  <p id="msg" class="meta">앱을 여는 중이에요…</p>
  <p><a id="open" class="button" href="wannarun://auth/confirm">뛸래 앱에서 열기</a></p>
  <p class="meta">앱이 열리지 않으면 위 버튼을 눌러 주세요. 뛸래가 설치된 폰에서 메일을 열어야 해요.</p>
</main>
<script>
  (function () {
    var target = 'wannarun://auth/confirm' + location.search + location.hash;
    var params = new URLSearchParams((location.hash || '').replace(/^#/, '') + '&' + (location.search || '').replace(/^\?/, ''));
    var msg = document.getElementById('msg');
    if (params.get('error_description') || params.get('error')) {
      msg.textContent = '링크가 만료됐거나 이미 썼어요. 앱에서 다시 요청해 주세요.';
    } else if (params.get('type') === 'recovery') {
      msg.textContent = '확인됐어요. 앱에서 새 비밀번호를 정해 주세요.';
    } else {
      msg.textContent = '확인됐어요. 앱으로 돌아가 주세요.';
    }
    document.getElementById('open').href = target;
    location.replace(target);
  })();
</script>
</body>
</html>
